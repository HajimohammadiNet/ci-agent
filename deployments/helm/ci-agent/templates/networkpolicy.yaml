{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ci-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ci-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ci-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    {{- if .Values.networkPolicy.ingress.allowFromAllNamespaces }}
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
    {{- else }}
    []
    {{- end }}

  egress:
    {{- if .Values.networkPolicy.egress.allowAll }}
    - {}
    {{- else }}
    []
    {{- end }}
{{- end }}
