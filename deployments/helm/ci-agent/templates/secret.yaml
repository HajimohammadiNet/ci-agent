{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ci-agent.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ci-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.keys.gitlabToken }}: {{ required "secret.values.gitlabToken is required when secret.create=true" .Values.secret.values.gitlabToken | quote }}
  {{ .Values.secret.keys.apiToken }}: {{ required "secret.values.apiToken is required when secret.create=true" .Values.secret.values.apiToken | quote }}
{{- end }}
