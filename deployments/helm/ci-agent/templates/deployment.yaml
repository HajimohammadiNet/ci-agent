{{- $ai := .Values.ai | default dict }}
{{- $openrouter := .Values.openrouter | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ci-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ci-agent.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "ci-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ci-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ci-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ci-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --listen
            - ":{{ .Values.containerPort }}"
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: GITLAB_URL
              value: {{ .Values.config.gitlabUrl | quote }}

            - name: GITLAB_HTTP_TIMEOUT
              value: {{ .Values.config.gitlabHttpTimeout | quote }}

            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ci-agent.secretName" . }}
                  key: {{ .Values.secret.keys.gitlabToken | quote }}

            - name: CI_AGENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ci-agent.secretName" . }}
                  key: {{ .Values.secret.keys.apiToken | quote }}

            - name: AI_ENABLED
              value: {{ default false $ai.enabled | quote }}

            - name: AI_PROVIDER
              value: {{ default "openrouter" $ai.provider | quote }}

            - name: OPENROUTER_MODEL
              value: {{ default "deepseek/deepseek-v4-pro" $openrouter.model | quote }}

            - name: OPENROUTER_BASE_URL
              value: {{ default "https://openrouter.ai/api/v1/chat/completions" $openrouter.baseUrl | quote }}

            - name: OPENROUTER_TIMEOUT
              value: {{ default "60s" $openrouter.timeout | quote }}

            - name: OPENROUTER_MAX_EVIDENCE
              value: {{ default 40 $openrouter.maxEvidence | quote }}

            - name: OPENROUTER_APP_TITLE
              value: {{ default "ci-agent" $openrouter.appTitle | quote }}

            - name: OPENROUTER_HTTP_REFERER
              value: {{ default "" $openrouter.httpReferer | quote }}

            - name: OPENROUTER_PREMIUM_MODEL
              value: {{ default "" $openrouter.premiumModel | quote }}

            - name: OPENROUTER_PREMIUM_TIMEOUT
              value: {{ default "90s" $openrouter.premiumTimeout | quote }}

            - name: OPENROUTER_PREMIUM_MAX_EVIDENCE
              value: {{ default 25 $openrouter.premiumMaxEvidence | quote }}

            - name: OPENROUTER_FALLBACK_MODEL
              value: {{ default "" $openrouter.fallbackModel | quote }}

            - name: OPENROUTER_FALLBACK_TIMEOUT
              value: {{ default "45s" $openrouter.fallbackTimeout | quote }}

            - name: OPENROUTER_FALLBACK_MAX_EVIDENCE
              value: {{ default 10 $openrouter.fallbackMaxEvidence | quote }}

            - name: OPENROUTER_PREMIUM_FALLBACK_MODEL
              value: {{ default "" $openrouter.premiumFallbackModel | quote }}

            - name: OPENROUTER_PREMIUM_FALLBACK_TIMEOUT
              value: {{ default "60s" $openrouter.premiumFallbackTimeout | quote }}

            - name: OPENROUTER_PREMIUM_FALLBACK_MAX_EVIDENCE
              value: {{ default 15 $openrouter.premiumFallbackMaxEvidence | quote }}

            {{- if and (default false $ai.enabled) (eq (default "openrouter" $ai.provider) "openrouter") }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "openrouter.existingSecret is required when ai.enabled=true and ai.provider=openrouter" $openrouter.existingSecret | quote }}
                  key: {{ default "OPENROUTER_API_KEY" $openrouter.secretKey | quote }}
            {{- end }}

          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}

          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}

          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}