replicaCount: 1

image:
  repository: registry.rahkar.team/agentops/ci-agent
  tag: "0.3.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: regcred

config:
  gitlabUrl: "https://gitlab.rahkar.team"
  gitlabHttpTimeout: "120s"

secret:
  create: false
  existingSecret: ci-agent-secret
  keys:
    gitlabToken: GITLAB_TOKEN
    apiToken: CI_AGENT_API_TOKEN

ai:
  enabled: true
  provider: openrouter

openrouter:
  model: deepseek/deepseek-v4-pro
  baseUrl: https://openrouter.ai/api/v1/chat/completions
  timeout: 75s
  maxEvidence: 15
  appTitle: ci-agent
  httpReferer: ""
  existingSecret: ci-agent-openrouter-secret
  secretKey: OPENROUTER_API_KEY
  premiumModel: deepseek/deepseek-v4-pro
  premiumTimeout: 90s
  premiumMaxEvidence: 25
  
service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: kong
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/preserve-host: "true"
    konghq.com/connect-timeout: "60000"
    konghq.com/read-timeout: "120000"
    konghq.com/write-timeout: "120000"
  hosts:
    - host: ci-agent.rahkar.team
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # If TLS is terminated at Kong/HAProxy and cert is managed elsewhere, keep tls empty.
  # If Kubernetes TLS secret is used:
  # tls:
  #   - secretName: ci-agent-tls
  #     hosts:
  #       - ci-agent.rahkar.team

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
