services:
  ci-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ci-agent:local
    container_name: ci-agent
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
